<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Shopify SEO Blog Agent Platform architecture</title>
  <desc id="desc">Architecture diagram showing Next.js web, BullMQ worker, Python agent service, Postgres, Redis, object storage, Shopify, Google Search Console, and AI provider.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#eef6f3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#11342d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#46635c"/>
    </marker>
    <style>
      .title{font:700 30px Arial, sans-serif;fill:#13231f}
      .subtitle{font:400 16px Arial, sans-serif;fill:#557068}
      .group{fill:#ffffff;stroke:#d8e4df;stroke-width:1.5;filter:url(#shadow)}
      .node{fill:#f9fbfa;stroke:#b9cec6;stroke-width:1.4}
      .node2{fill:#eef8f5;stroke:#7bb6a6;stroke-width:1.6}
      .node3{fill:#fff8ed;stroke:#e0b66f;stroke-width:1.5}
      .label{font:700 17px Arial, sans-serif;fill:#18302a}
      .small{font:400 13px Arial, sans-serif;fill:#587169}
      .tiny{font:400 12px Arial, sans-serif;fill:#6e817b}
      .pill{fill:#173c35}
      .pillText{font:700 12px Arial, sans-serif;fill:#ffffff}
      .line{fill:none;stroke:#46635c;stroke-width:2;marker-end:url(#arrow)}
      .line2{fill:none;stroke:#84a79e;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1320" height="760" fill="url(#bg)"/>
  <text x="54" y="64" class="title">Shopify SEO Blog Agent Platform</text>
  <text x="54" y="92" class="subtitle">AI content operations for Shopify: generation, review, publishing, Search Console learning, and Python agent orchestration.</text>

  <rect x="54" y="134" width="360" height="470" rx="18" class="group"/>
  <text x="82" y="176" class="label">User Surface</text>
  <text x="82" y="200" class="small">Next.js App Router, server routes, forms, dashboards</text>
  <rect x="86" y="232" width="294" height="76" rx="14" class="node2"/>
  <text x="110" y="264" class="label">Admin Console</text>
  <text x="110" y="288" class="small">Dashboard, Agent Center, Stores, Articles</text>
  <rect x="86" y="332" width="294" height="76" rx="14" class="node"/>
  <text x="110" y="364" class="label">Server API Routes</text>
  <text x="110" y="388" class="small">Campaigns, publishing, settings, health</text>
  <rect x="86" y="432" width="294" height="92" rx="14" class="node"/>
  <text x="110" y="464" class="label">Operator Workflow</text>
  <text x="110" y="488" class="small">One next action from Agent Center</text>
  <text x="110" y="508" class="tiny">Research -> Write -> Gate -> Publish -> Review</text>

  <rect x="478" y="134" width="364" height="470" rx="18" class="group"/>
  <text x="506" y="176" class="label">Execution Layer</text>
  <text x="506" y="200" class="small">Queues, generation, quality gates, publishing</text>
  <rect x="510" y="232" width="298" height="76" rx="14" class="node2"/>
  <text x="534" y="264" class="label">BullMQ Worker</text>
  <text x="534" y="288" class="small">blog.generate, article.publish, sync jobs</text>
  <rect x="510" y="332" width="298" height="76" rx="14" class="node"/>
  <text x="534" y="364" class="label">Content Engine</text>
  <text x="534" y="388" class="small">SEO scoring, humanizer, evidence, HTML</text>
  <rect x="510" y="432" width="298" height="92" rx="14" class="node3"/>
  <text x="534" y="464" class="label">Python Agent Service</text>
  <text x="534" y="488" class="small">Workflow plan, quality gate, repair plan</text>
  <text x="534" y="508" class="tiny">FastAPI migration target for orchestration</text>

  <rect x="906" y="134" width="360" height="470" rx="18" class="group"/>
  <text x="934" y="176" class="label">Data and Integrations</text>
  <text x="934" y="200" class="small">Persistent state, queues, media, external APIs</text>
  <rect x="938" y="232" width="130" height="76" rx="14" class="node"/>
  <text x="964" y="264" class="label">Postgres</text>
  <text x="956" y="288" class="tiny">Prisma models</text>
  <rect x="1100" y="232" width="130" height="76" rx="14" class="node"/>
  <text x="1137" y="264" class="label">Redis</text>
  <text x="1126" y="288" class="tiny">BullMQ</text>
  <rect x="938" y="332" width="130" height="76" rx="14" class="node"/>
  <text x="970" y="364" class="label">S3/MinIO</text>
  <text x="965" y="388" class="tiny">images</text>
  <rect x="1100" y="332" width="130" height="76" rx="14" class="node2"/>
  <text x="1130" y="364" class="label">Shopify</text>
  <text x="1118" y="388" class="tiny">Admin API</text>
  <rect x="938" y="432" width="130" height="92" rx="14" class="node3"/>
  <text x="960" y="464" class="label">Google</text>
  <text x="949" y="488" class="small">Search Console</text>
  <text x="962" y="508" class="tiny">OAuth 2.0</text>
  <rect x="1100" y="432" width="130" height="92" rx="14" class="node2"/>
  <text x="1144" y="464" class="label">AI</text>
  <text x="1117" y="488" class="small">OpenAI-compatible</text>
  <text x="1138" y="508" class="tiny">text + image</text>

  <path d="M380 270 C430 270 452 270 510 270" class="line"/>
  <path d="M380 370 C430 370 452 370 510 370" class="line"/>
  <path d="M808 270 C860 270 888 270 938 270" class="line"/>
  <path d="M808 270 C900 232 1020 232 1100 270" class="line"/>
  <path d="M808 370 C900 370 1010 370 1100 370" class="line"/>
  <path d="M808 478 C858 478 888 478 938 478" class="line2"/>
  <path d="M808 478 C908 520 1018 520 1100 478" class="line2"/>
  <path d="M660 432 C660 414 660 410 660 408" class="line"/>
  <path d="M660 332 C660 320 660 316 660 308" class="line"/>

  <rect x="54" y="646" width="1212" height="58" rx="16" fill="#173c35"/>
  <text x="82" y="682" class="pillText">Rule of thumb: generate and publish can continue without Search Console; Search Console only unlocks post-publish evidence for ranking decisions.</text>
</svg>
