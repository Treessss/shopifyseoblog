<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" aria-labelledby="title desc" role="img" viewBox="0 0 1320 520"><title id="title">SEO article workflow</title><desc id="desc">Workflow diagram for research, generation, quality gate, publishing, indexing, Search Console review, and refresh.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#35544d" d="M0,0 L0,6 L9,3 z"/></marker><style>.bg{fill:#f8fbfa}.title{font:700 30px Arial,sans-serif;fill:#12241f}.sub{font:400 15px Arial,sans-serif;fill:#587169}.step{fill:#fff;stroke:#cbded8;stroke-width:1.6}.stepHot,.stepWarn{fill:#eef8f5;stroke:#75ac9d;stroke-width:1.8}.stepWarn{fill:#fff8ec;stroke:#dfb263}.label{font:700 17px Arial,sans-serif;fill:#19322b}.small{font:400 13px Arial,sans-serif;fill:#5d746d}.num{fill:#173c35}.numText{font:700 14px Arial,sans-serif;fill:#fff}.dash,.line{fill:none;stroke-width:2;marker-end:url(#arrow)}.line{stroke:#35544d}.dash{stroke:#809c95;stroke-dasharray:7 6}.note{fill:#173c35}.noteText{font:700 13px Arial,sans-serif;fill:#fff}</style></defs><rect width="1320" height="520" class="bg"/><text x="48" y="58" class="title">SEO Blog Agent Workflow</text><text x="48" y="86" class="sub">The product separates publish readiness, index readiness, and ranking readiness so operators know what evidence is still missing.</text><g transform="translate(48,134)"><rect width="160" height="132" class="stepHot" rx="18"/><circle cx="28" cy="30" r="16" class="num"/><text x="23" y="35" class="numText">1</text><text x="24" y="70" class="label">Research</text><text x="24" y="96" class="small">keywords, products</text><text x="24" y="116" class="small">intent, evidence</text></g><g transform="translate(248,134)"><rect width="160" height="132" class="step" rx="18"/><circle cx="28" cy="30" r="16" class="num"/><text x="23" y="35" class="numText">2</text><text x="24" y="70" class="label">Brief</text><text x="24" y="96" class="small">angle, outline</text><text x="24" y="116" class="small">links, citations</text></g><g transform="translate(448,134)"><rect width="160" height="132" class="step" rx="18"/><circle cx="28" cy="30" r="16" class="num"/><text x="23" y="35" class="numText">3</text><text x="24" y="70" class="label">Generate</text><text x="24" y="96" class="small">human-like article</text><text x="24" y="116" class="small">Shopify HTML</text></g><g transform="translate(648,134)"><rect width="160" height="132" class="stepWarn" rx="18"/><circle cx="28" cy="30" r="16" class="num"/><text x="23" y="35" class="numText">4</text><text x="24" y="70" class="label">Quality Gate</text><text x="24" y="96" class="small">SEO score, depth</text><text x="24" y="116" class="small">humanizer, links</text></g><g transform="translate(848,134)"><rect width="160" height="132" class="step" rx="18"/><circle cx="28" cy="30" r="16" class="num"/><text x="23" y="35" class="numText">5</text><text x="24" y="70" class="label">Publish</text><text x="24" y="96" class="small">Shopify Admin API</text><text x="24" y="116" class="small">canonical URL</text></g><g transform="translate(1048,134)"><rect width="160" height="132" class="stepHot" rx="18"/><circle cx="28" cy="30" r="16" class="num"/><text x="23" y="35" class="numText">6</text><text x="24" y="70" class="label">Review</text><text x="24" y="96" class="small">GSC queries, CTR</text><text x="24" y="116" class="small">ranking refresh</text></g><path d="M208 200 H248" class="line"/><path d="M408 200 H448" class="line"/><path d="M608 200 H648" class="line"/><path d="M808 200 H848" class="line"/><path d="M1008 200 H1048" class="line"/><path d="M728 266 C728 332 528 338 528 274" class="dash"/><text x="470" y="358" class="sub">If the gate fails, repair the draft before publishing.</text><g transform="translate(164,382)"><rect width="990" height="62" class="note" rx="16"/><text x="28" y="38" class="noteText">Publish-ready means quality passed. Index-ready means a public canonical URL exists. Rank-ready needs Search Console evidence after launch.</text></g></svg>