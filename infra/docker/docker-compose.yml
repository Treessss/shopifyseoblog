name: shopify-ai-blog-saas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopify_blog
      POSTGRES_PASSWORD: shopify_blog
      POSTGRES_DB: shopify_blog
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopify_blog -d shopify_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${SHOPIFY_BLOG_REDIS_PORT:-6381}:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run db:generate && npm --workspace apps/web run dev"
    env_file:
      - ../../.env
    ports:
      - "3000:3000"
    volumes:
      - ../..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run db:generate && npm --workspace apps/worker run dev"
    env_file:
      - ../../.env
    volumes:
      - ../..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
